<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Посещаемость · Ҳозиршавӣ</title>
  <link rel="stylesheet" href="/assets/hrms/css/attendance-kiosk.css">
</head>
<body>
  <main class="attendance-kiosk">
    <header><h1 id="title"></h1><select id="language" aria-label="Язык / Забон"><option value="ru">Русский</option><option value="tg">Тоҷикӣ</option></select></header>
    <p id="shop"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="pairing" hidden>
      <form id="pair-form">
        <label for="code" id="code-label"></label>
        <input id="code" type="password" autocomplete="off" maxlength="160" required>
        <button id="pair" type="submit"></button>
      </form>
    </section>
    <section id="attendance" hidden>
      <form id="attendance-form" autocomplete="off">
        <label for="employee" id="employee-label"></label>
        <select id="employee" required></select>
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" required>
        <div class="actions"><button id="in" type="submit" value="IN"></button><button id="out" type="submit" value="OUT"></button></div>
      </form>
    </section>
    <section id="recovery" hidden><p id="pending-label"></p><div class="actions"><button id="lookup" type="button"></button><button id="retry" type="button"></button></div></section>
    <button id="refresh" type="button"></button>
    <p id="online-help" class="muted"></p>
  </main>
  <script src="/assets/hrms/js/attendance-kiosk.js" defer></script>
</body>
</html>
